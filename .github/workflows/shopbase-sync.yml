name: ShopBase catalog sync

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:
    inputs:
      refresh_details:
        description: 'Refresh every existing product detail (images, stock, sizes, description, and pricing)'
        required: true
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: shopbase-catalog-sync
  cancel-in-progress: false

jobs:
  cadence:
    runs-on: ubuntu-latest
    outputs:
      due: ${{ steps.cadence.outputs.due }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install schedule checker dependency
        run: pip install pymongo
      - name: Check saved sync interval and start time
        id: cadence
        shell: bash
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            echo "due=true" >> "$GITHUB_OUTPUT"
          else
            python backend/sync_schedule.py
          fi
        env:
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
          MONGODB_DATABASE: aaro
  sync:
    needs: cadence
    if: needs.cadence.outputs.due == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 360
    defaults:
      run:
        working-directory: backend
    env:
      MONGODB_URI: ${{ secrets.MONGODB_URI }}
      MONGODB_DATABASE: aaro
      SHOPBASE_SESSION_COOKIE: ${{ secrets.SHOPBASE_SESSION_COOKIE }}
      SHOPBASE_USERNAME: ${{ secrets.SHOPBASE_USERNAME }}
      SHOPBASE_PASSWORD: ${{ secrets.SHOPBASE_PASSWORD }}
      AARO_MARKUP_PERCENT: '20'
      SHOPBASE_REQUEST_DELAY_SECONDS: '0.35'
      SHOPBASE_DETAIL_REFRESH_DAYS: '7'
      SHOPBASE_FORCE_DETAIL_REFRESH: ${{ github.event_name == 'workflow_dispatch' && inputs.refresh_details }}
      CLOUDINARY_CLOUD_NAME: ${{ secrets.CLOUDINARY_CLOUD_NAME }}
      CLOUDINARY_API_KEY: ${{ secrets.CLOUDINARY_API_KEY }}
      CLOUDINARY_API_SECRET: ${{ secrets.CLOUDINARY_API_SECRET }}
      CLOUDINARY_MIRROR_IMAGES: 'false'
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install importer dependencies
        run: pip install -r requirements.txt
      - name: Identify hosted browser version
        id: playwright-version
        run: echo "version=$(python -c 'import importlib.metadata; print(importlib.metadata.version("playwright"))')" >> "$GITHUB_OUTPUT"
      - name: Cache hosted sign-in browser
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ steps.playwright-version.outputs.version }}
      - name: Install hosted sign-in browser
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: python -m playwright install --with-deps chromium
      - name: Run catalog sync
        run: python sync_shopbase.py

